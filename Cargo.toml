[workspace]
resolver = "2"
members = [
  "apps/windows/src-tauri",
  "crates/discovery",
  "crates/pairing",
  "crates/security",
  "crates/transfer-core",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.84"

[workspace.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
mdns-sd = "0.17"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
