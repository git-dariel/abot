[package]
name = "abot-windows"
version = "0.1.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[lib]
name = "abot_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
abot-security = { path = "../../../crates/security" }
abot-pairing = { path = "../../../crates/pairing" }
abot-discovery = { path = "../../../crates/discovery" }
abot-transfer-core = { path = "../../../crates/transfer-core" }
base64.workspace = true
hex.workspace = true
hmac.workspace = true
local-ip-address = "0.6"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
