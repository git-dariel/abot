<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">Abot concept A, Bridge Pulse</title>
  <desc id="desc">Two geometric device forms meet around a cornflower blue connection point beside the Abot wordmark.</desc>
  <rect width="640" height="200" fill="#FFFFFF"/>
  <g id="symbol" transform="translate(28 28)">
    <path fill="#050505" d="M0 0h68v28H28v88h40v28H0z"/>
    <path fill="#548CFF" d="M144 0H76v28h40v88H76v28h68z"/>
    <rect x="58" y="58" width="28" height="28" rx="4" fill="#050505"/>
    <circle cx="72" cy="72" r="6" fill="#FFFFFF"/>
  </g>
  <g id="wordmark" fill="#050505" font-family="Geist, Inter, Arial, sans-serif">
    <text x="212" y="116" font-size="82" font-weight="800" letter-spacing="-6">abot</text>
    <circle cx="375" cy="106" r="8" fill="#548CFF"/>
  </g>
</svg>
