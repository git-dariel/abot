<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">Abot concept B, Relay A</title>
  <desc id="desc">A bold split letter A uses a blue relay bar to express a trusted handoff beside the Abot wordmark.</desc>
  <rect width="640" height="200" fill="#FFFFFF"/>
  <g id="symbol" transform="translate(24 24)">
    <path fill="#050505" d="M0 152 52 0h38L42 152z"/>
    <path fill="#050505" d="m152 152-52-152H62l48 152z"/>
    <rect x="39" y="88" width="74" height="24" rx="12" fill="#548CFF"/>
    <circle cx="39" cy="100" r="12" fill="#050505"/>
    <circle cx="113" cy="100" r="12" fill="#050505"/>
  </g>
  <g id="wordmark" fill="#050505" font-family="Geist, Inter, Arial, sans-serif">
    <text x="212" y="116" font-size="82" font-weight="800" letter-spacing="-6">abot</text>
    <circle cx="375" cy="106" r="8" fill="#548CFF"/>
  </g>
</svg>
